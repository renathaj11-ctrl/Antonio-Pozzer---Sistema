<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2b5b" />
    <title>Sem conexão · Antonio Pozzer</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #0b2b5b;
        --navy-deep: #071b38;
        --brand: #2e7bc4;
        --ink: #12263f;
        --muted: #5b7189;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(760px 460px at 6% 2%, #ffffff 0%, rgba(255, 255, 255, 0) 64%),
          radial-gradient(860px 520px at 96% 98%, #ffffff 0%, rgba(255, 255, 255, 0) 60%),
          linear-gradient(168deg, #eaf6ff 0%, #dcecfa 48%, #cbe3f8 100%);
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 34px 30px 30px;
        text-align: center;
        background: #fff;
        border-radius: 28px;
        box-shadow: 0 32px 80px -44px rgba(7, 27, 56, 0.55), 0 10px 28px -22px rgba(7, 27, 56, 0.4);
      }
      .mark {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 21px;
        background: linear-gradient(135deg, #1b66a8 0%, #0f3f77 55%, #071b38 100%);
        box-shadow: 0 14px 26px -14px rgba(7, 27, 56, 0.65);
      }
      .mark svg { width: 38px; height: 38px; fill: #fff; }
      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--brand);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        width: 100%;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #2e7bc4 0%, #14508f 100%);
        box-shadow: 0 14px 26px -16px rgba(20, 80, 143, 0.85);
      }
      button:active { transform: translateY(1px); }
      .foot {
        margin: 20px 0 0;
        font-size: 11px;
        color: #93a7bd;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.8.5-1.2Z" />
        </svg>
      </div>
      <p class="eyebrow">Antonio Pozzer</p>
      <h1>Sem conexão</h1>
      <p>
        Não foi possível acessar o sistema agora. Verifique a internet do dispositivo e tente novamente.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <p class="foot">Por segurança, nenhum dado de paciente fica salvo no aparelho.</p>
    </main>
  </body>
</html>
